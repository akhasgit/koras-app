name: koras
description: "Koras — AI voice-coaching mobile app (iOS + Android)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (Riverpod 2, code-generated)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # Routing
  go_router: ^14.2.0

  # Backend clients
  supabase_flutter: ^2.5.6
  http: ^1.2.1
  web_socket_channel: ^3.0.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Permissions (microphone)
  permission_handler: ^11.3.1

  # Audio: capture + playback
  record: ^5.1.2
  audio_session: ^0.1.21
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3

  # Deep links (OAuth + invites)
  app_links: ^6.1.1

  # UI / theming / icons / fonts
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.0
  cached_network_image: ^3.3.1

  # Utilities
  uuid: ^4.4.0
  csv: ^6.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0

  # Lints
  flutter_lints: ^4.0.0

  # Testing
  mocktail: ^1.0.4

  # App icon generation
  flutter_launcher_icons: ^0.14.3

# analyzer_plugin <0.13.1 is incompatible with analyzer 7.x (publiclyExporting2),
# which breaks the build_runner script. Pin the fixed release. See dart-lang/sdk#60784.
dependency_overrides:
  analyzer_plugin: ^0.13.1
  record_platform_interface: 1.5.0
  record_linux: 1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/i18n/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/appLogo.png
  adaptive_icon_background: "#FAF7F2"
  adaptive_icon_foreground: assets/icons/appLogo.png
  remove_alpha_ios: true
