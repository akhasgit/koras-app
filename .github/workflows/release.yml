name: Release

# Tag-triggered release (v1.2.3 → beta). Signing material is supplied via repo
# secrets (match repo + key for iOS, service-account JSON for Android).
on:
  push:
    tags: ['v*']

jobs:
  android-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.x
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Fastlane beta (Play internal)
        working-directory: android
        run: bundle exec fastlane beta

  ios-beta:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.x
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Fastlane beta (TestFlight)
        working-directory: ios
        run: bundle exec fastlane beta
