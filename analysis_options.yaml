include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # freezed forwards @JsonKey/@Default onto generated members; the warning on
    # the factory parameter is a known false positive.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    prefer_const_constructors: true
